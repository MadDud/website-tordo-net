<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tordo.net</title>
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <style>
    :root {
      --bg-color: #111111;
      --panel-bg: #131313;
      --quote-bg: #1e1e1e;
      --text-muted: #777777;
      --footer-text: #666666;
      --accent-blue: #045453;
      --link-color: lightblue;
      --link-hover: #eeeeee;
      --link-active: yellow;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-color);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      color: #ffffff;
    }

    header.main {
      width: 100%;
      margin-top: 27px;
      padding: 27px 0;
      text-align: center;
      background-color: var(--panel-bg);
    }

    img.logo {
      width: 200px;
      height: auto;
      display: inline-block;
    }

    hr.blue {
      border: 0;
      height: 1px;
      background-color: var(--accent-blue);
      margin: 30px 10%;
    }

    main {
      flex: 1;
      width: 100%;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      align-items: center;
      gap: 30px;
    }

    div.quote {
      width: 100%;
      max-width: 666px;
      margin: 0 10%;
      background-color: var(--quote-bg);
      text-align: center;
    }

    p.quote {
      color: var(--text-muted);
      font-size: 1.16rem;
      font-style: italic;
      line-height: 1.3;
      padding: 27px 10%;
    }

    footer.footer {
      width: 100%;
      padding: 27px 0;
      text-align: center;
      background-color: var(--panel-bg);
      color: var(--footer-text);
      margin-top: 40px;
    }

    a:link, 
    a:visited {
      color: var(--link-color);
      text-decoration: none;
    }

    a:hover {
      color: var(--link-hover);
    }

    a:active {
      color: var(--link-active);
    }
    img.book-icon {
      filter: brightness(0.4);
    }
  </style>
</head>
<body>

  <header class="main">
    <a href="https://tordo.net">
      <img class="logo" src="/src/Tordo-logo-2022-rectangle-500.png" alt="Tordo logo">
    </a>
  </header>

  <hr class="blue">

  <main>
